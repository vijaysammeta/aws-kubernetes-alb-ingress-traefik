# ==========================================
# INSURANCE APPLICATION
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: insurance
  template:
    metadata:
      labels:
        app: insurance
    spec:
      containers:
        - name: insurance-container
          image: vijaysammeta/insurance-image:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-service
spec:
  type: NodePort
  selector:
    app: insurance
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31433

